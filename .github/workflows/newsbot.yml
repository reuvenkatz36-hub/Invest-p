name: News Bot

# The bot keeps ITSELF running: each run stays awake ~55 min (answering Telegram messages
# within seconds and scanning news every 15 min), then launches the next run (see the
# "Relaunch" step). The cron is only a cold-start safety net in case the chain breaks —
# GitHub's scheduler is often hours late, so we don't rely on it.
# Briefing timing comes from the real NYSE calendar (DST, holidays, early closes), and
# every briefing/alert is de-duplicated, so overlapping or late runs never double-send.
on:
  schedule:
    - cron: "11 */2 * * *"
  workflow_dispatch: {}

# One run at a time. New runs queue behind the current one (GitHub keeps at most one
# waiting), so the chain can never multiply.
concurrency:
  group: newsbot
  cancel-in-progress: false

permissions:
  contents: write   # commit config.json when you change the watchlist
  actions: write    # relaunch itself

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Dedupe memory (seen headlines, queued items, sent briefings) between runs.
      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: newsbot-state-${{ github.run_id }}
          restore-keys: newsbot-state-

      - name: Run news bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: "claude-opus-5-5"
        run: python -m newsbot --loop 3300 --interval 900

      - name: Save bot state
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: newsbot-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit watchlist changes
        if: always()
        run: |
          if git diff --quiet -- config.json; then exit 0; fi
          git config user.name "newsbot"
          git config user.email "actions@users.noreply.github.com"
          git add config.json
          git commit -m "Update watchlist [skip ci]"
          for i in 1 2 3 4; do
            git push && exit 0
            git pull --rebase --autostash origin main || true
            sleep $((i * 2))
          done
          echo "::warning::watchlist change could not be pushed"
          exit 1

      - name: Relaunch (keep the bot running)
        if: ${{ !cancelled() }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/newsbot.yml/dispatches" \
            -d '{"ref":"main"}'
