name: News Bot

# Runs every 15 minutes. Each run: reads your Telegram commands, pushes CRITICAL/HIGH
# news alerts for your watchlist, and sends the pre-market / after-close briefing when
# due. Briefing timing comes from the real NYSE calendar (DST, holidays, early closes),
# not from this cron — so GitHub firing late doesn't matter, and nothing is sent twice.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: newsbot
  cancel-in-progress: false

permissions:
  contents: write   # commit config.json when you /add or /remove a stock

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Dedupe memory (seen headlines, queued items, sent briefings) between runs.
      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: newsbot-state-${{ github.run_id }}
          restore-keys: newsbot-state-

      - name: Run news bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: "claude-opus-5-5"
        run: python -m newsbot

      - name: Save bot state
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: newsbot-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit watchlist changes
        if: always()
        run: |
          if git diff --quiet -- config.json; then exit 0; fi
          git config user.name "newsbot"
          git config user.email "actions@users.noreply.github.com"
          git add config.json
          git commit -m "Update watchlist [skip ci]"
          for i in 1 2 3 4; do
            git push && exit 0
            git pull --rebase --autostash || true
            sleep $((i * 2))
          done
          echo "::warning::watchlist change could not be pushed"
          exit 1
